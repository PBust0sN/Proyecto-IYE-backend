spring:
  application:
    name: cronicotrak

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:iye-db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak emite tokens con este issuer; Spring lo verifica en el claim "iss"
          issuer-uri: ${KC_ISSUER_URI:https://auth.sarabia-ti.cl/realms/iye}
          # JWKS explícito para no bloquear el startup si Keycloak tarda en arrancar
          jwk-set-uri: ${KC_ISSUER_URI:https://auth.sarabia-ti.cl/realms/iye}/protocol/openid-connect/certs

# ── CORS ──────────────────────────────────────────────────────────
app:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}

# ── Cifrado de datos sensibles ─────────────────────────────────────
# Clave maestra AES (base64, 32 bytes) para cifrar datos de pacientes.
# En producción DEBE venir de la variable de entorno ENC_KEY (secret manager).
# El default solo sirve para desarrollo local / tests.
  encryption:
    key: ${ENC_KEY:n+WPGF8DECxYtC80EBZur9WDZIZS3reCBLNB9zJ3ZVU=}
    # true → re-cifra datos existentes que aún están en claro (una sola vez).
    migrate: ${ENC_MIGRATE:false}

# ── Actuator ───────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

# ── Evolution API ──────────────────────────────────────────────────
evolution:
  api:
    url: ${EVOLUTION_API_URL:http://localhost:8081}
    key: ${EVOLUTION_API_KEY:clave_secreta_123}
    instance: ${EVOLUTION_API_INSTANCE:mi_whatsapp}
