services:
  iye-keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    container_name: iye-keycloak
    restart: unless-stopped
    command: start-dev
    ports:
      - "8180:8080"
    environment:
      # ── Base de datos ────────────────────────────────────────
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://iye-db:5432/${KC_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${DB_USER:-postgres}
      KC_DB_PASSWORD: ${DB_PASSWORD:-postgres}
      # ── Admin bootstrap (Keycloak 26+) ───────────────────────
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      # ── HTTP / hostname ──────────────────────────────────────
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_PORT: "8080"
    networks:
      - iye-net
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.75"
        reservations:
          memory: 256M
          cpus: "0.25"

networks:
  iye-net:
    external: true
    name: iye-net
