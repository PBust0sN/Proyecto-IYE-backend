name: cronicotrack

services:
  iye-db:
    image: postgres:17-alpine
    container_name: iye-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-iye}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
    volumes:
      - iye-db:/var/lib/postgresql/data
      - ../Database/scheme.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../Database/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
      - ../Database/keycloak-init.sql:/docker-entrypoint-initdb.d/03-keycloak-init.sql:ro
    networks:
      - iye-net
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.75"
        reservations:
          memory: 256M
          cpus: "0.15"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-iye}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  iye-keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    container_name: iye-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    volumes:
      - ./iye-realm.json:/opt/keycloak/data/import/iye-realm.json:ro
    ports:
      - "8180:8080"
    environment:
      # ── Base de datos ────────────────────────────────────────
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://iye-db:5432/${KC_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${DB_USER:-postgres}
      KC_DB_PASSWORD: ${DB_PASSWORD:-admin}
      # ── Admin bootstrap (Keycloak 26+) ───────────────────────
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      # ── HTTP / hostname ──────────────────────────────────────
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_PORT: "8080"
      # ── Health ───────────────────────────────────────────────
      KC_HEALTH_ENABLED: "true"
    depends_on:
      iye-db:
        condition: service_healthy
    networks:
      - iye-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.75"
        reservations:
          memory: 256M
          cpus: "0.25"

volumes:
  iye-db:

networks:
  iye-net:
    name: iye-net
    driver: bridge