services:
  iye-db:
    image: postgres:17-alpine
    container_name: iye-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-iye}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - iye-db:/var/lib/postgresql/data
      - ../Database/scheme.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - default
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.75"
        reservations:
          memory: 256M
          cpus: "0.15"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-iye}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  iye-db: